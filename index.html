            if (!merged.userProfile.onboardingCompleted) {
              merged.uiState.onboardingModalOpen = true;
            }
            return merged;

        } catch (e) {
          console.warn('Failed to parse localStorage, resetting to default', e);
        }
        const initial = this.getDefaultState();
        initial.uiState.onboardingModalOpen = true;
        return initial;

        try {
          localStorage.setItem(this.STORAGE_KEY, JSON.stringify(this.state));
        } catch (e) {
          console.error('Failed to write localStorage', e);

        if (!this.events[eventName]) this.events[eventName] = [];

        this.saveState();

    // --- SecureKeyVault: IndexedDB + Web Crypto AES-GCM + XOR Obfuscation ---
    class SecureKeyVault {
      static DB_NAME = 'hustlepipe_secure_vault_v2';
      static DB_VERSION = 1;
      static STORE_NAME = 'api_vault';

      static async openDB() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(SecureKeyVault.DB_NAME, SecureKeyVault.DB_VERSION);
          request.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(SecureKeyVault.STORE_NAME)) {
              db.createObjectStore(SecureKeyVault.STORE_NAME, { keyPath: 'provider' });
            }
          };
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
      }

      // Key derivation via PBKDF2 with device hardware & environment entropy
      static async getEncryptionKey() {
        const salt = new TextEncoder().encode('HustlePipe-Nordic-Salt-v2-Engine');
        const userSeed = `${navigator.userAgent || 'UA'}-${screen.width || 1920}x${screen.height || 1080}-${navigator.language || 'sv'}`;
        const baseKey = await window.crypto.subtle.importKey(
          'raw',
          new TextEncoder().encode(userSeed.padEnd(32, '0').slice(0, 32)),
          { name: 'PBKDF2' },
          false,
          ['deriveKey']
        );

        return window.crypto.subtle.deriveKey(
          {
            name: 'PBKDF2',
            salt: salt,
            iterations: 100000,
            hash: 'SHA-256'
          },
          baseKey,
          { name: 'AES-GCM', length: 256 },
          false,
          ['encrypt', 'decrypt']
        );
      }

      // Secondary obfuscation layer (byte-level XOR mask to thwart memory inspection)
      static obfuscateBytes(bytes) {
        const mask = [0x5A, 0xC3, 0x17, 0x8F, 0x4D, 0xE2, 0x9B, 0x34];
        const out = new Uint8Array(bytes.length);
        for (let i = 0; i < bytes.length; i++) {
          out[i] = bytes[i] ^ mask[i % mask.length];
        }
        return out;
      }

      static async storeKey(provider, rawKey) {
        if (!rawKey || !rawKey.trim()) {
          await SecureKeyVault.deleteKey(provider);
          return null;
        }

        const trimmed = rawKey.trim();
        const masked = trimmed.slice(0, 4) + '••••••••••••' + trimmed.slice(-4);

        try {
          const cryptoKey = await SecureKeyVault.getEncryptionKey();
          const iv = window.crypto.getRandomValues(new Uint8Array(12));
          const encoded = new TextEncoder().encode(trimmed);
          
          const cipherBuffer = await window.crypto.subtle.encrypt(
            { name: 'AES-GCM', iv },
            cryptoKey,
            encoded
          );

          const obfuscated = SecureKeyVault.obfuscateBytes(new Uint8Array(cipherBuffer));
          const record = {
            provider,
            iv: Array.from(iv),
            payload: Array.from(obfuscated),
            masked,
            updatedAt: Date.now()
          };

          const db = await SecureKeyVault.openDB();
          return new Promise((resolve, reject) => {
            const tx = db.transaction(SecureKeyVault.STORE_NAME, 'readwrite');
            const store = tx.objectStore(SecureKeyVault.STORE_NAME);
            const req = store.put(record);
            req.onsuccess = () => resolve(masked);
            req.onerror = () => reject(req.error);
          });
        } catch (err) {
          console.warn('SubtleCrypto error, applying fallback obfuscation in IndexedDB:', err);
          const b64 = btoa(encodeURIComponent(trimmed));
          const db = await SecureKeyVault.openDB();
          return new Promise((resolve, reject) => {
            const tx = db.transaction(SecureKeyVault.STORE_NAME, 'readwrite');
            const store = tx.objectStore(SecureKeyVault.STORE_NAME);
            const req = store.put({
              provider,
              payload: b64,
              isFallback: true,
              masked,
              updatedAt: Date.now()
            });
            req.onsuccess = () => resolve(masked);
            req.onerror = () => reject(req.error);
          });
        }
      }

      static async retrieveKey(provider) {
        try {
          const db = await SecureKeyVault.openDB();
          const record = await new Promise((resolve, reject) => {
            const tx = db.transaction(SecureKeyVault.STORE_NAME, 'readonly');
            const store = tx.objectStore(SecureKeyVault.STORE_NAME);
            const req = store.get(provider);
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
          });

          if (!record) return null;

          if (record.isFallback) {
            return decodeURIComponent(atob(record.payload));
          }

          const cryptoKey = await SecureKeyVault.getEncryptionKey();
          const iv = new Uint8Array(record.iv);
          const deobfuscated = SecureKeyVault.obfuscateBytes(new Uint8Array(record.payload));

          const decrypted = await window.crypto.subtle.decrypt(
            { name: 'AES-GCM', iv },
            cryptoKey,
            deobfuscated
          );

          return new TextDecoder().decode(decrypted);
        } catch (err) {
          console.warn('Failed to retrieve key from SecureKeyVault:', err);
          return null;
        }
      }

      static async getMaskedHint(provider) {
        try {
          const db = await SecureKeyVault.openDB();
          return new Promise((resolve) => {
            const tx = db.transaction(SecureKeyVault.STORE_NAME, 'readonly');
            const store = tx.objectStore(SecureKeyVault.STORE_NAME);
            const req = store.get(provider);
            req.onsuccess = () => resolve(req.result ? req.result.masked : null);
            req.onerror = () => resolve(null);
          });
        } catch (e) {
          return null;
        }
      }

      static async deleteKey(provider) {
        try {
          const db = await SecureKeyVault.openDB();
          return new Promise((resolve, reject) => {
            const tx = db.transaction(SecureKeyVault.STORE_NAME, 'readwrite');
            const store = tx.objectStore(SecureKeyVault.STORE_NAME);
            const req = store.delete(provider);
            req.onsuccess = () => resolve(true);
            req.onerror = () => reject(req.error);
          });
        } catch (e) {
          return false;
        }
      }
    }

    class AIAgentService {

        const baseRole = "You are an expert AI e-commerce & dropshipping specialist embedded in HustlePipe (SideForge Engine).";
        
        let tabRole = "E-Commerce Onboarding Mentor specializing in Scandinavian & European DTC markets.";
        if (activeTab === 'scraper') tabRole = "Senior Dropshipping Product Researcher focusing on margins, saturation analysis, and supply chain reliability.";
        if (activeTab === 'composer') tabRole = "Elite Conversion Rate Optimization (CRO) and Scandinavian UI/UX Designer specializing in high-trust Nordic layouts.";
        if (activeTab === 'marketing') tabRole = "Viral TikTok & UGC Script Writer crafting high-converting 3-second hooks, problem-solution pacing, and call-to-actions.";
        if (activeTab === 'compliance' || activeTab === 'operations') tabRole = "Swedish/EU Legal, Compliance & MOMS/VAT Financial Advisor (Skatteverket, Konsumentverket, GDPR).";

        let experienceModulator = "Provide structured, actionable guidance with balanced strategic depth.";
        if (experienceLevel === 'rookie') {
          experienceModulator = "Explain concepts simply with encouraging step-by-step clarity. Define acronyms (MOMS, ROAS, UGC). Do not assume technical or web development knowledge.";
        } else if (experienceLevel === 'expert') {
          experienceModulator = "Provide raw formulas, metrics, architecture suggestions, and direct executable code or copy. Be concise, deterministic, and skip basic pleasantries.";
        }

        return `${baseRole}\nActive Specialty: ${tabRole}\nComplexity Mode (${experienceLevel}): ${experienceModulator}\nAlways output clean Markdown format.`;
      }

      // Fetch models dynamically from Groq or OpenRouter documented endpoints
      static async fetchAvailableModels(provider, apiKey) {
        if (provider === 'groq') {
          if (!apiKey) {
            throw new Error('A Groq API key is required to query Groq\'s live model catalog (https://api.groq.com/openai/v1/models).');
          }
          // Groq documented endpoint: GET https://api.groq.com/openai/v1/models
          const res = await fetch('https://api.groq.com/openai/v1/models', {
            headers: {
              'Authorization': `Bearer ${apiKey.trim()}`,
              'Content-Type': 'application/json'
            }
          });
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.error?.message || `Groq API returned HTTP ${res.status}`);
          }
          const data = await res.json();
          // Return all active hosted text models, filtering out audio transcription whisper models
          const models = (data.data || [])
            .filter(m => m.active !== false && !m.id.toLowerCase().includes('whisper'))
            .map(m => ({
              id: m.id,
              name: m.id,
              badge: `${m.owned_by || 'Hosted'} • ${m.context_window ? Math.round(m.context_window / 1024) + 'k ctx' : 'Fast'}`,
              speed: 'Fast Inference'
            }));
          return models.length > 0 ? models : FREE_MODELS.groq;
        } else {
          // OpenRouter documented endpoint: GET https://openrouter.ai/api/v1/models
          const res = await fetch('https://openrouter.ai/api/v1/models');
          if (!res.ok) {
            throw new Error(`OpenRouter API returned HTTP ${res.status}`);
          }
          const data = await res.json();
          // Filter free models (id ends in :free or pricing prompt == 0)
          const freeModels = (data.data || [])
            .filter(m => m.id && (m.id.endsWith(':free') || (m.pricing && m.pricing.prompt === '0')))
            .map(m => ({
              id: m.id,
              name: m.name || m.id,
              badge: 'Zero Cost • :free Tier',
              speed: m.context_length ? `${Math.round(m.context_length / 1024)}k ctx` : 'Free'
            }));
          return freeModels.length > 0 ? freeModels : FREE_MODELS.openrouter;
        }
      }

      // Real ping connection test to measure latency & verify credentials
      static async testConnection(provider, apiKey, model) {
        const startTime = Date.now();
        let url = 'https://api.groq.com/openai/v1/chat/completions';
        let headers = {

        const response = await fetch(url, {
          method: 'POST',
          headers,

              { role: 'user', content: 'Respond with exactly the 4 words: "HustlePipe AI connected successfully."' }
            ],
            max_tokens: 20,
            temperature: 0.1
          })
        });

        }

        const data = await response.json();

      static async queryAI(prompt, state) {
        const { provider, selectedModel } = state.userProfile.aiSettings;
        const systemPrompt = AIAgentService.getSystemPrompt(state.userProfile.experienceLevel, state.uiState.activeTab);

        // Retrieve decrypted key from IndexedDB Secure Vault (or fallback state)
        let apiKey = await SecureKeyVault.retrieveKey(provider);
        if (!apiKey && state.userProfile.aiSettings.apiKey) {
          apiKey = state.userProfile.aiSettings.apiKey;
        }

        if (!apiKey) {
          // Fallback simulation when no key is set yet
          await new Promise(r => setTimeout(r, 600));
          return `ℹ️ **BYOK Notice:** *No active ${provider.toUpperCase()} API key detected in Secure Vault. Using built-in Scandinavian e-commerce simulation. Connect your free API key in BYOK Settings for live fast inference.*\n\n` +
            AIAgentService.generateSmartFallback(prompt, state.uiState.activeTab, state.userProfile.experienceLevel);
        }

        try {
          let url = 'https://api.groq.com/openai/v1/chat/completions';
          let headers = {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey.trim()}`
          };

          if (provider === 'openrouter') {
            url = 'https://openrouter.ai/api/v1/chat/completions';
            headers['HTTP-Referer'] = window.location.origin || 'https://hustlepipe.app';

                { role: 'user', content: prompt }

              temperature: 0.7,

            })
          });

          if (!response.ok) {

                      const isDone = step.done;

      // --- Event Binding & Actions ---
      bindEvents() {
        // Traditional Menu Toggle & Slide-In Side Panel
        document.getElementById('btn-toggle-menu')?.addEventListener('click', () => {
          this.engine.update(s => {
            s.uiState.sideMenuOpen = !s.uiState.sideMenuOpen;
            s.uiState.userProfileModalOpen = false;
          });
        });

        document.getElementById('btn-close-side-menu')?.addEventListener('click', () => {
          this.engine.update(s => s.uiState.sideMenuOpen = false);
        });

        document.getElementById('side-menu-overlay')?.addEventListener('click', () => {
          this.engine.update(s => s.uiState.sideMenuOpen = false);
        });

        // Side Menu Navigation Tabs
        document.querySelectorAll('[data-side-tab]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const tab = e.currentTarget.getAttribute('data-side-tab');
            this.engine.update(s => {
              s.uiState.activeTab = tab;
              s.uiState.sideMenuOpen = false;
            });
          });
        });

        // Side Menu Actions (Tour, Preview, AI, Profile)
        document.getElementById('btn-side-menu-tour')?.addEventListener('click', () => {
          this.engine.update(s => {
            s.uiState.sideMenuOpen = false;
            s.uiState.onboardingStep = 0;
            s.uiState.onboardingModalOpen = true;
          });
        });

        document.getElementById('btn-side-menu-preview')?.addEventListener('click', () => {
          this.engine.update(s => s.uiState.sideMenuOpen = false);
          this.openStorePreview();
        });

        document.getElementById('btn-side-menu-ai')?.addEventListener('click', () => {
          this.engine.update(s => {
            s.uiState.sideMenuOpen = false;
            s.uiState.aiDrawerOpen = true;
          });
        });

        document.getElementById('btn-side-menu-profile')?.addEventListener('click', () => {
          this.engine.update(s => {
            s.uiState.sideMenuOpen = false;
            s.uiState.userProfileModalOpen = true;
          });
        });

        // User Profile & Preferences Modal Controls
        document.getElementById('btn-toggle-user-profile')?.addEventListener('click', () => {
          this.engine.update(s => {
            s.uiState.userProfileModalOpen = !s.uiState.userProfileModalOpen;
            s.uiState.sideMenuOpen = false;
          });
        });

        document.getElementById('btn-close-user-profile')?.addEventListener('click', () => {
          this.engine.update(s => s.uiState.userProfileModalOpen = false);
        });

        document.getElementById('user-profile-overlay')?.addEventListener('click', () => {
          this.engine.update(s => s.uiState.userProfileModalOpen = false);
        });

        document.querySelectorAll('[data-profile-level]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const lvl = e.currentTarget.getAttribute('data-profile-level');
            this.setExperience(lvl);
          });
        });

        document.getElementById('btn-profile-launch-tour')?.addEventListener('click', () => {
          this.engine.update(s => {
            s.uiState.userProfileModalOpen = false;
            s.uiState.onboardingStep = 0;
            s.uiState.onboardingModalOpen = true;
          });
        });

        document.getElementById('btn-profile-open-vault')?.addEventListener('click', () => {
          this.engine.update(s => {
            s.uiState.userProfileModalOpen = false;
            s.uiState.activeTab = 'settings';
          });
        });

        // Experience Level Buttons
        document.getElementById('btn-lvl-rookie')?.addEventListener('click', () => this.setExperience('rookie'));
        document.getElementById('btn-lvl-inter')?.addEventListener('click', () => this.setExperience('intermediate'));
        document.getElementById('btn-lvl-expert')?.addEventListener('click', () => this.setExperience('expert'));

        document.querySelectorAll('[data-set-level]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            this.setExperience(e.currentTarget.getAttribute('data-set-level'));
          });
        });

        // Theme Toggle (Supports direct buttons and generic toggle)
        document.getElementById('btn-theme-light')?.addEventListener('click', () => {
          this.engine.update(s => s.uiState.theme = 'light');
          this.applyTheme('light');
        });
        document.getElementById('btn-theme-dark')?.addEventListener('click', () => {
          this.engine.update(s => s.uiState.theme = 'dark');
          this.applyTheme('dark');
        });
        document.getElementById('btn-toggle-theme')?.addEventListener('click', () => {
          const current = this.engine.state.uiState.theme;
          const next = current === 'dark' ? 'light' : 'dark';
          this.engine.update(s => s.uiState.theme = next);
          this.applyTheme(next);
        });

        // Nav Tabs
        document.querySelectorAll('.tab-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const tab = e.currentTarget.getAttribute('data-tab');
            this.engine.update(s => s.uiState.activeTab = tab);
          });
        });

        // Pipeline Step Toggles
        document.querySelectorAll('[data-step-toggle]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const id = e.currentTarget.getAttribute('data-step-toggle');
            this.engine.update(s => {
              const step = s.pipelineSteps.find(st => st.id === id);
              if (step) step.done = !step.done;
            });
          });
        });

        // Pipeline Quick Action Buttons
        document.querySelectorAll('[data-quick-action]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const id = e.currentTarget.getAttribute('data-quick-action');
            if (id === 'step_ai') this.engine.update(s => s.uiState.activeTab = 'settings');
            else if (id === 'step_scrape') this.engine.update(s => s.uiState.activeTab = 'scraper');
            else if (id === 'step_compose') this.engine.update(s => s.uiState.activeTab = 'composer');
            else if (id === 'step_deploy') this.openStorePreview();
            else if (id === 'step_marketing') this.engine.update(s => s.uiState.activeTab = 'marketing');
            else this.engine.update(s => s.uiState.activeTab = 'compliance');
          });
        });

        // Scraper Actions
        document.getElementById('btn-run-scrape')?.addEventListener('click', () => this.handleRunScraper());

        document.querySelectorAll('[data-add-to-store]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const id = e.currentTarget.getAttribute('data-add-to-store');
            this.addProductToStore(id);
          });
        });

        document.querySelectorAll('[data-ai-hook-for]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const id = e.currentTarget.getAttribute('data-ai-hook-for');
            this.openAiHookForProduct(id);
          });
        });

        // Store Composer Actions
        document.getElementById('btn-preview-store')?.addEventListener('click', () => this.openStorePreview());
        document.getElementById('btn-close-store-preview')?.addEventListener('click', () => {
          this.engine.update(s => s.uiState.storePreviewModal = false);
        });

        document.getElementById('btn-export-bundle')?.addEventListener('click', () => this.downloadStandaloneBundle());
        document.getElementById('btn-export-shopify')?.addEventListener('click', () => this.downloadPlatformCSV());

        // Block Editors Input
        document.querySelectorAll('[data-edit-block]').forEach(input => {
          input.addEventListener('input', (e) => {
            const blockId = e.currentTarget.getAttribute('data-edit-block');
            const field = e.currentTarget.getAttribute('data-field');
            const val = e.currentTarget.value;
            const store = this.engine.getActiveStore();
            const block = store.blocks.find(b => b.id === blockId);
            if (block) {
              block[field] = val;
              this.engine.saveState();
            }
          });
        });

        // Payment check toggles
        ['swish', 'klarna', 'stripe'].forEach(type => {
          const chk = document.getElementById(`chk-${type}`);
          if (chk) {
            chk.addEventListener('change', (e) => {
              const store = this.engine.getActiveStore();
              store.paymentMethods[type] = e.currentTarget.checked;
              this.engine.saveState();
            });
          }
        });

        // Financial Calculators Logic
        this.bindCalculators();

        // AI Drawer Controls
        document.getElementById('btn-toggle-ai')?.addEventListener('click', () => {
          this.engine.update(s => s.uiState.aiDrawerOpen = !s.uiState.aiDrawerOpen);
        });
        document.getElementById('btn-close-ai')?.addEventListener('click', () => {
          this.engine.update(s => s.uiState.aiDrawerOpen = false);
        });
        document.getElementById('btn-send-ai')?.addEventListener('click', () => this.sendAIMessage());
        document.getElementById('ai-user-input')?.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') this.sendAIMessage();
        });
        document.querySelectorAll('.ai-quick-prompt').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const p = e.currentTarget.getAttribute('data-prompt');
            const input = document.getElementById('ai-user-input');
            if (input) input.value = p;
            this.sendAIMessage();
          });
        });

        // Marketing Script Generator
        document.getElementById('btn-generate-ai-script')?.addEventListener('click', () => this.generateViralHook());
        document.querySelectorAll('.btn-copy-hook').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const text = e.currentTarget.getAttribute('data-copy');
            navigator.clipboard.writeText(text);
            const original = e.currentTarget.innerText;
            e.currentTarget.innerText = 'Copied! ✓';
            setTimeout(() => e.currentTarget.innerText = original, 1500);
          });
        });

        // Settings: Provider Switcher
        document.getElementById('settings-provider')?.addEventListener('change', async (e) => {
          const provider = e.target.value;
          const defaultModel = provider === 'groq' ? 'llama-3.3-70b-versatile' : 'deepseek/deepseek-r1:free';
          this.liveModels = [];
          this.testConnectionResult = null;
          this.engine.update(s => {
            s.userProfile.aiSettings.provider = provider;
            s.userProfile.aiSettings.selectedModel = defaultModel;
          });
          await this.checkVaultKeyHint();
          this.render();
          this.refreshIcons();
        });

        // Settings: Model Selector
        document.getElementById('settings-model')?.addEventListener('change', (e) => {
          const selectedModel = e.target.value;
          this.engine.update(s => {
            s.userProfile.aiSettings.selectedModel = selectedModel;
          });
          const badgeEl = document.querySelector('#ai-drawer .font-mono');
          if (badgeEl) badgeEl.innerText = selectedModel;
        });

        // Settings: Key Visibility Toggle
        document.getElementById('btn-toggle-key-visibility')?.addEventListener('click', () => {
          this.keyInputVisible = !this.keyInputVisible;
          const input = document.getElementById('settings-api-key');
          if (input) input.type = this.keyInputVisible ? 'text' : 'password';
          const icon = document.querySelector('#btn-toggle-key-visibility i');
          if (icon) {
            icon.setAttribute('data-lucide', this.keyInputVisible ? 'eye-off' : 'eye');
            this.refreshIcons();
          }
        });

        // Settings: Fetch Live Models from Groq or OpenRouter
        document.getElementById('btn-fetch-models')?.addEventListener('click', async () => {
          const provider = document.getElementById('settings-provider')?.value || 'groq';
          const inputKey = document.getElementById('settings-api-key')?.value.trim();
          const vaultKey = await SecureKeyVault.retrieveKey(provider);
          const activeKey = inputKey || vaultKey;

          this.isFetchingModels = true;
          this.render();
          this.refreshIcons();

          try {
            const models = await AIAgentService.fetchAvailableModels(provider, activeKey);
            this.liveModels = models;
            this.testConnectionResult = {
              success: true,
              message: `Retrieved ${models.length} active models directly from ${provider.toUpperCase()} API catalog.`
            };
          } catch (err) {
            this.testConnectionResult = {
              success: false,
              message: `Could not fetch live models: ${err.message}`
            };
          } finally {
            this.isFetchingModels = false;
            this.render();
            this.refreshIcons();
          }
        });

        // Settings: Test Connection & Latency
        document.getElementById('btn-test-connection')?.addEventListener('click', async () => {
          const provider = document.getElementById('settings-provider')?.value || 'groq';
          const model = document.getElementById('settings-model')?.value || 'llama-3.3-70b-versatile';
          const inputKey = document.getElementById('settings-api-key')?.value.trim();
          const vaultKey = await SecureKeyVault.retrieveKey(provider);
          const activeKey = inputKey || vaultKey;

          if (!activeKey) {
            this.testConnectionResult = {
              success: false,
              message: `Please enter an API key for ${provider.toUpperCase()} before running the connection test.`
            };
            this.render();
            this.refreshIcons();
            return;
          }

          this.isTestingConnection = true;
          this.testConnectionResult = null;
          this.render();
          this.refreshIcons();

          try {
            const result = await AIAgentService.testConnection(provider, activeKey, model);
            this.testConnectionResult = {
              success: true,
              message: `⚡ Connected in ${result.latency}ms! Model: ${result.model} responded: "${result.text}"`
            };
          } catch (err) {
            this.testConnectionResult = {
              success: false,
              message: `Inference test failed: ${err.message}`
            };
          } finally {
            this.isTestingConnection = false;
            this.render();
            this.refreshIcons();
          }
        });

        // Settings: Save & Encrypt Key in IndexedDB Vault
        document.getElementById('btn-save-settings')?.addEventListener('click', async () => {
          const provider = document.getElementById('settings-provider')?.value || 'groq';
          const apiKey = document.getElementById('settings-api-key')?.value.trim();
          const selectedModel = document.getElementById('settings-model')?.value.trim();

          if (apiKey) {
            await SecureKeyVault.storeKey(provider, apiKey);
          }

          this.engine.update(s => {
            s.userProfile.aiSettings.provider = provider;
            s.userProfile.aiSettings.selectedModel = selectedModel;
            // Never persist plaintext key in localStorage!
            s.userProfile.aiSettings.apiKey = '';
            const aiStep = s.pipelineSteps.find(st => st.id === 'step_ai');
            if (aiStep) aiStep.done = true;
          });

          await this.checkVaultKeyHint();
          this.testConnectionResult = {
            success: true,
            message: `Key successfully encrypted with AES-GCM and stored inside browser IndexedDB! Ready for real inference.`
          };
          this.render();
          this.refreshIcons();
        });

        // Settings: Clear Key from IndexedDB Vault
        document.getElementById('btn-clear-vault-key')?.addEventListener('click', async () => {
          const provider = this.engine.state.userProfile.aiSettings?.provider || 'groq';
          await SecureKeyVault.deleteKey(provider);
          await this.checkVaultKeyHint();
          this.testConnectionResult = {
            success: true,
            message: `API Key for ${provider.toUpperCase()} permanently removed from encrypted vault.`
          };
          this.render();
          this.refreshIcons();
        });

        // Onboarding Stepper Modal Controls
        document.getElementById('btn-open-tour')?.addEventListener('click', () => {
          this.engine.update(s => {
            s.uiState.onboardingModalOpen = true;
          });
        });

        document.getElementById('btn-close-onboarding')?.addEventListener('click', () => {
          this.engine.update(s => {
            s.uiState.onboardingModalOpen = false;
            s.userProfile.onboardingCompleted = true;
          });
        });

        document.getElementById('btn-tour-skip')?.addEventListener('click', () => {
          this.engine.update(s => {
            s.uiState.onboardingModalOpen = false;
            s.userProfile.onboardingCompleted = true;
          });
        });

        document.getElementById('btn-tour-prev')?.addEventListener('click', () => {
          this.engine.update(s => {
            if (s.uiState.onboardingStep > 0) s.uiState.onboardingStep -= 1;
          });
        });

        document.getElementById('btn-tour-next')?.addEventListener('click', () => {
          this.engine.update(s => {
            if (s.uiState.onboardingStep < 4) s.uiState.onboardingStep += 1;
          });
        });

        document.getElementById('btn-tour-finish')?.addEventListener('click', () => {
          this.engine.update(s => {
            s.uiState.onboardingModalOpen = false;
            s.userProfile.onboardingCompleted = true;
          });
        });

        document.querySelectorAll('[data-tour-step]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const st = parseInt(e.currentTarget.getAttribute('data-tour-step'), 10);
            if (!isNaN(st)) {
              this.engine.update(s => {
                s.uiState.onboardingStep = st;
              });
            }
          });
        });

        // Settings Tour Controls
        document.getElementById('btn-replay-tour')?.addEventListener('click', () => {
          this.engine.update(s => {
            s.uiState.onboardingStep = 0;
            s.uiState.onboardingModalOpen = true;
          });
        });

        document.getElementById('btn-reset-tour')?.addEventListener('click', () => {
          this.engine.update(s => {
            s.userProfile.onboardingCompleted = false;
            s.uiState.onboardingStep = 0;
          });
          alert('Tour completion status has been reset. It will launch on reload or you can click "Replay" anytime!');
        });

        document.getElementById('btn-open-manual')?.addEventListener('click', () => {
          this.engine.update(s => {
            s.uiState.activeTab = 'about';
            s.uiState.aboutSubTab = 'manual';
          });
        });

        // About View Sub-Tabs & Actions
        document.querySelectorAll('[data-about-subtab]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const tab = e.currentTarget.getAttribute('data-about-subtab');
            this.engine.update(s => {
              s.uiState.aboutSubTab = tab;
            });
          });
        });

        document.getElementById('btn-about-launch-tour')?.addEventListener('click', () => {
          this.engine.update(s => {
            s.uiState.onboardingStep = 0;
            s.uiState.onboardingModalOpen = true;
          });
        });

        document.getElementById('btn-about-open-manual')?.addEventListener('click', () => {
          this.engine.update(s => {
            s.uiState.aboutSubTab = 'manual';
          });
        });

        // FAQ Category filter & accordion toggles
        document.querySelectorAll('[data-faq-category]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const cat = e.currentTarget.getAttribute('data-faq-category');
            this.engine.update(s => {
              s.uiState.activeFaqCategory = cat;
            });
          });
        });

        document.querySelectorAll('[data-faq-toggle]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const idx = parseInt(e.currentTarget.getAttribute('data-faq-toggle'), 10);
            this.engine.update(s => {
              if (!s.uiState.expandedFaqs) s.uiState.expandedFaqs = [];
              const pos = s.uiState.expandedFaqs.indexOf(idx);
              if (pos > -1) {
                s.uiState.expandedFaqs.splice(pos, 1);
              } else {
                s.uiState.expandedFaqs.push(idx);
              }
            });
          });
        });

        document.getElementById('btn-toggle-ai-faq')?.addEventListener('click', () => {
          this.engine.update(s => {
            s.uiState.aiDrawerOpen = true;
          });
        });

        // CLI input
        document.getElementById('cli-input')?.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            this.handleCliCommand(e.currentTarget.value.trim());
            e.currentTarget.value = '';
          }
        });
      }

      setExperience(lvl) {
        this.engine.update(s => {
          s.userProfile.experienceLevel = lvl;
          if (lvl === 'rookie' && ['operations', 'marketing', 'compliance'].includes(s.uiState.activeTab)) {
            s.uiState.activeTab = 'pipeline';
          }
        });
      }

      openStorePreview() {
        this.engine.update(s => s.uiState.storePreviewModal = true);
      }

      handleRunScraper() {
        const input = document.getElementById('scraper-url-input');
        const url = input?.value?.trim();
        if (!url) {
          alert('Please enter a product URL or test link.');
          return;
        }

        // Demo scraper simulation adding a new card
        const newProduct = {
          id: 'sq_' + Date.now(),
          title: 'Nordic Lumbar Orthopedic Seat Cushion',
          supplierUrl: url,
          supplierCost: 110,
          estSalePrice: 389,
          currency: 'SEK',
          images: ['https://images.unsplash.com/photo-1584100936595-c0654b55a2e2?w=600&auto=format&fit=crop&q=80'],
          niche: 'Ergonomics',
          dailyOrders: 210,
          profitMargin: 59
        };

        this.engine.update(s => {
          s.scrapedQueue.unshift(newProduct);
          const scrapeStep = s.pipelineSteps.find(st => st.id === 'step_scrape');
          if (scrapeStep) scrapeStep.done = true;
        });

        if (input) input.value = '';
      }

      addProductToStore(queueId) {
        const item = this.engine.state.scrapedQueue.find(q => q.id === queueId);
        if (!item) return;

        this.engine.update(s => {
          const store = s.stores.find(st => st.id === s.activeStoreId) || s.stores[0];
          const exists = store.products.some(p => p.title === item.title);
          if (!exists) {
            store.products.push({
              id: 'prod_' + Date.now(),
              title: item.title,
              supplierCost: item.supplierCost,
              salePrice: item.estSalePrice,
              currency: 'SEK',
              image: item.images[0],
              rating: 4.9,
              reviewsCount: 38,
              desc: 'High demand ergonomic Scandinavian product imported via HustlePipe.',
              features: ['Premium materials', 'Swedish MOMS included', 'Fast PostNord delivery']
            });
          }
          s.uiState.activeTab = 'composer';
        });
      }

      openAiHookForProduct(queueId) {
        const item = this.engine.state.scrapedQueue.find(q => q.id === queueId);
        if (!item) return;
        this.engine.update(s => {
          s.uiState.aiDrawerOpen = true;
        });
        const input = document.getElementById('ai-user-input');
        if (input) {
          input.value = `Write 3 viral TikTok hooks for "${item.title}" priced at ${item.estSalePrice} SEK with Swish payment.`;
          this.sendAIMessage();
        }
      }

      bindCalculators() {
        const calcProfit = () => {
          const retail = parseFloat(document.getElementById('calc-retail')?.value || 0);
          const supplier = parseFloat(document.getElementById('calc-supplier')?.value || 0);
          const cpa = parseFloat(document.getElementById('calc-cpa')?.value || 0);
          const ship = parseFloat(document.getElementById('calc-ship')?.value || 0);

          // Swedish MOMS deduction: MOMS is 20% of gross price (which equals 25% on net)
          const moms = retail * 0.20;
          const netRevenue = retail - moms;
          const totalCost = supplier + cpa + ship;
          const netProfit = netRevenue - totalCost;
          const margin = retail > 0 ? ((netProfit / retail) * 100).toFixed(1) : 0;

          const out = document.getElementById('calc-profit-output');
          if (out) {
            out.innerHTML = `
              <div class="flex justify-between py-0.5"><span>Brutto Pris:</span> <strong>${retail.toFixed(2)} SEK</strong></div>
              <div class="flex justify-between py-0.5 text-rose-600 dark:text-rose-400"><span>25% MOMS till Skatteverket:</span> <strong>-${moms.toFixed(2)} SEK</strong></div>
              <div class="flex justify-between py-0.5"><span>Nettointäkt:</span> <strong>${netRevenue.toFixed(2)} SEK</strong></div>
              <div class="flex justify-between py-0.5 text-slate-500"><span>COGS & Ad Spend:</span> <strong>-${totalCost.toFixed(2)} SEK</strong></div>
              <div class="border-t border-emerald-300 dark:border-emerald-700 pt-1.5 mt-1 flex justify-between font-bold text-sm ${netProfit >= 0 ? 'text-emerald-700 dark:text-emerald-300' : 'text-rose-600'}">
                <span>Ren Vinst Per Order:</span> <span>${netProfit.toFixed(2)} SEK (${margin}%)</span>
              </div>
            `;
          }
        };

        const calcRoas = () => {
          const price = parseFloat(document.getElementById('calc-roas-price')?.value || 0);
          const cogs = parseFloat(document.getElementById('calc-roas-cogs')?.value || 0);
          const grossProfit = price - cogs;
          const breakevenRoas = grossProfit > 0 ? (price / grossProfit).toFixed(2) : 'N/A';

          const out = document.getElementById('calc-roas-output');
          if (out) {
            out.innerHTML = `
              <div class="flex justify-between py-0.5"><span>Bruttomarginal Ex MOMS:</span> <strong>${grossProfit.toFixed(2)} SEK</strong></div>
              <div class="border-t border-blue-300 dark:border-blue-700 pt-1.5 mt-1 flex justify-between font-bold text-sm text-blue-700 dark:text-blue-300">
                <span>Breakeven ROAS:</span> <span>${breakevenRoas}x</span>
              </div>
              <p class="text-[10px] text-slate-400 mt-1">If your TikTok ad ROAS exceeds ${breakevenRoas}x, every Swedish order is strictly profitable.</p>
            `;
          }
        };

        ['calc-retail', 'calc-supplier', 'calc-cpa', 'calc-ship'].forEach(id => {
          document.getElementById(id)?.addEventListener('input', calcProfit);
        });
        ['calc-roas-price', 'calc-roas-cogs'].forEach(id => {
          document.getElementById(id)?.addEventListener('input', calcRoas);
        });

        calcProfit();
        calcRoas();
      }

      async sendAIMessage() {
        const input = document.getElementById('ai-user-input');
        const prompt = input?.value?.trim();
        if (!prompt) return;

        input.value = '';
        const chatBox = document.getElementById('ai-chat-messages');

        // Append User Message
        const userMsg = document.createElement('div');
        userMsg.className = 'bg-blue-600 text-white p-2.5 rounded-xl ml-6 text-right';
        userMsg.innerText = prompt;
        chatBox.appendChild(userMsg);

        // Loading indicator
        const loadingMsg = document.createElement('div');
        loadingMsg.className = 'bg-gray-100 dark:bg-slate-800 p-2.5 rounded-xl text-slate-400 italic flex items-center gap-1.5';
        loadingMsg.innerHTML = '<i data-lucide="loader-2" class="w-3.5 h-3.5 animate-spin"></i> Specialist thinking...';
        chatBox.appendChild(loadingMsg);
        this.refreshIcons();
        chatBox.scrollTop = chatBox.scrollHeight;

        const reply = await AIAgentService.queryAI(prompt, this.engine.state);
        chatBox.removeChild(loadingMsg);

        // Append AI Reply
        const aiMsg = document.createElement('div');
        aiMsg.className = 'bg-gray-100 dark:bg-slate-800 p-3 rounded-xl text-slate-800 dark:text-slate-200 leading-relaxed';
        aiMsg.innerHTML = reply.replace(/\n/g, '<br>');
        chatBox.appendChild(aiMsg);
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      async generateViralHook() {
        const box = document.getElementById('marketing-script-box');
        if (box) box.innerHTML = '<div class="flex items-center gap-2 text-blue-600"><i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Crafting viral Swedish hook...</div>';
        this.refreshIcons();

        const reply = await AIAgentService.queryAI("Generate a brand new 20-second viral Swedish TikTok dropshipping ad script for AuraLum Ergonomic Pillow with Swish CTA.", this.engine.state);
        if (box) {
          box.innerHTML = reply.replace(/\n/g, '<br>');
        }
      }

      downloadStandaloneBundle() {
        const store = this.engine.getActiveStore();
        const html = `<!doctype html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>${store.name} - Officiell Butik</title>
  <script src="https://cdn.tailwindcss.com"><\/script>
</head>
<body class="bg-[#FAFAFA] text-[#0F172A] min-h-screen">
  <div class="max-w-3xl mx-auto p-4 sm:p-8 space-y-6">
    <div class="bg-blue-600 text-white text-xs font-semibold py-2 px-4 rounded-xl text-center">
      🇸🇪 Fri frakt med PostNord vid beställning över 399 SEK
    </div>
    <div class="text-center py-6">
      <h1 class="text-3xl font-extrabold">${store.blocks.find(b => b.type === 'hero')?.title || store.name}</h1>
      <p class="text-slate-600 mt-2">${store.blocks.find(b => b.type === 'hero')?.subtitle || ''}</p>
    </div>
    <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-200 grid md:grid-cols-2 gap-6 items-center">
      <img src="${store.products[0]?.image || ''}" class="rounded-xl w-full h-56 object-cover">
      <div>
        <h2 class="text-xl font-bold">${store.products[0]?.title || ''}</h2>
        <p class="text-slate-600 text-sm mt-1">${store.products[0]?.desc || ''}</p>
        <div class="my-4 text-2xl font-black text-blue-600">${store.products[0]?.salePrice || 449} SEK <span class="text-xs text-slate-400 font-normal">(25% MOMS ingår)</span></div>
        <button onclick="alert('Swish-betalning initierad!')" class="w-full py-3 rounded-xl bg-blue-600 text-white font-bold text-sm shadow hover:bg-blue-700">Köp direkt med Swish</button>
      </div>
    </div>
    <div class="text-center text-xs text-slate-400 pt-6">
      <p>© 2026 ${store.name}. 14 dagars öppet köp enligt Konsumentköplagen.</p>
    </div>
  </div>
</body>

        const blob = new Blob([html], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${store.name.toLowerCase().replace(/\s+/g, '-')}-bundle.html`;
        a.click();
        URL.revokeObjectURL(url);
      }

      downloadPlatformCSV() {
        const store = this.engine.getActiveStore();
        let csv = "Handle,Title,Body (HTML),Vendor,Type,Tags,Published,Option1 Name,Option1 Value,Variant SKU,Variant Grams,Variant Inventory Tracker,Variant Inventory Qty,Variant Inventory Policy,Variant Fulfillment Service,Variant Price,Variant Compare At Price,Variant Requires Shipping,Variant Taxable,Image Src\n";
        
        store.products.forEach((p, idx) => {
          const handle = p.title.toLowerCase().replace(/[^a-z0-9]+/g, '-');
          csv += `"${handle}","${p.title}","${p.desc}","${store.name}","Physical","dropshipping,nordic",TRUE,"Title","Default Title","SKU-${idx + 1}",350,"shopify",100,"deny","manual",${p.salePrice},${p.salePrice + 100},TRUE,TRUE,"${p.image}"\n`;
        });

        const blob = new Blob([csv], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${store.name.toLowerCase().replace(/\s+/g, '-')}-shopify-products.csv`;
        a.click();
        URL.revokeObjectURL(url);
      }

      handleCliCommand(cmd) {
        if (!cmd) return;
        if (cmd.startsWith('/scrape')) {
          this.engine.update(s => s.uiState.activeTab = 'scraper');
          const url = cmd.replace('/scrape', '').trim();
          if (url) {
            const input = document.getElementById('scraper-url-input');
            if (input) input.value = url;
            this.handleRunScraper();
          }
        } else if (cmd.startsWith('/export')) {
          this.downloadStandaloneBundle();
        } else if (cmd.startsWith('/calc')) {
          this.engine.update(s => s.uiState.activeTab = 'operations');
        } else if (cmd.startsWith('/ai')) {
          const prompt = cmd.replace('/ai', '').trim();
          this.engine.update(s => s.uiState.aiDrawerOpen = true);
          const input = document.getElementById('ai-user-input');
          if (input) {
            input.value = prompt;
            this.sendAIMessage();
          }
        } else {
          alert(`Unknown CLI command: ${cmd}\nTry: /scrape [url], /export, /calc, or /ai [prompt]`);
        }
      }
    }

    // Launch on DOM ready
    window.addEventListener('DOMContentLoaded', () => {
      new AppController();
    });
  </script>
</body>
</html>
